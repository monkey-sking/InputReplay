name: Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - dev/**

permissions:
  contents: read

jobs:
  swift:
    name: Swift build & tests
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve package
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v
